<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GTag VR - Nízký profil</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script>
      AFRAME.registerComponent('gtag-bounce', {
        init: function () {
          this.rig = document.getElementById('rig');
          this.prevY = 0;
          this.prevX = 0;
          this.prevZ = 0;
          
          // Sledování pohybu ruky
          this.currPos = new THREE.Vector3();
        },
        tick: function () {
          if (!this.rig) return;

          // Zjistíme absolutní pozici ovladače
          this.el.object3D.getWorldPosition(this.currPos);

          // Výpočet rychlosti švihu ruky směrem dolů/vzad
          let deltaX = this.currPos.x - this.prevX;
          let deltaY = this.currPos.y - this.prevY;
          let deltaZ = this.currPos.z - this.prevZ;

          // POHYB: Když je ruka blízko podlahy (výška pod 0.5 metru od reálné země)
          if (this.currPos.y < 0.5) {
            // Pokud ruka švihne směrem k zemi (deltaY < 0), vymrští hráče nahoru a dopředu
            if (deltaY < 0) {
              this.rig.object3D.position.x -= deltaX * 2.5;
              this.rig.object3D.position.y -= deltaY * 2.0; // Odraz nahoru
              this.rig.object3D.position.z -= deltaZ * 2.5;
            }
          }

          // Gravitace - pokud je hráč ve vzduchu, pomalu padá dolů
          if (this.rig.object3D.position.y > 0) {
            this.rig.object3D.position.y -= 0.03;
          } else {
            this.rig.object3D.position.y = 0;
          }

          this.prevX = this.currPos.x;
          this.prevY = this.currPos.y;
          this.prevZ = this.currPos.z;
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #87CEEB">
      <!-- Světlo a země -->
      <a-light type="ambient" intensity="0.8"></a-light>
      <a-plane position="0 0 0" rotation="-90 0 0" width="80" height="80" color="#2d6a4f"></a-plane>

      <!-- Překážky na odrážení (Krabice a Stěny) -->
      <a-box position="0 0.5 -2" width="2" height="1" depth="2" color="#582f0e"></a-box>
      <a-box position="-2 1 -4" width="2" height="2" depth="2" color="#7f4f24"></a-box>
      <a-box position="2 1.5 -5" width="2" height="3" depth="2" color="#582f0e"></a-box>

      <!-- HRÁČ (Pohled snížen na 0.4 m nad zemí!) -->
      <a-entity id="rig" position="0 0 0">
        <!-- Kamera snížená dolů k zemi -->
        <a-entity camera position="0 0.4 0" look-controls></a-entity>

        <!-- Levý ovladač (Červená ruka s detekcí odrazu) -->
        <a-entity oculus-touch-controls="hand: left" gtag-bounce>
          <a-sphere radius="0.15" color="#e63946"></a-sphere>
        </a-entity>

        <!-- Pravý ovladač (Modrá ruka s detekcí odrazu) -->
        <a-entity oculus-touch-controls="hand: right" gtag-bounce>
          <a-sphere radius="0.15" color="#1d3557"></a-sphere>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
