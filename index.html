<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GTag VR - Plné Kolize a Lezení</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script>
      AFRAME.registerComponent('gorilla-locomotion', {
        init: function () {
          this.leftHand = document.getElementById('leftHand');
          this.rightHand = document.getElementById('rightHand');
          
          this.velocity = new THREE.Vector3();
          this.gravity = -9.81;

          this.prevLeftLocal = new THREE.Vector3();
          this.prevRightLocal = new THREE.Vector3();
          this.hasPrev = false;
          
          // Hitbox ruky - koule o velikosti virtuálního ovladače
          this.handRadius = 0.12;
          this.sphere = new THREE.Sphere(new THREE.Vector3(), this.handRadius);
          this.box = new THREE.Box3();
        },
        
        // Funkce skenuje, jestli se ruka dotýká objektu s třídou "collidable"
        checkCollision: function (handEl) {
          if (!handEl) return false;
          
          // Zjistíme reálnou polohu ruky v prostoru
          handEl.object3D.getWorldPosition(this.sphere.center);
          
          let collidables = document.querySelectorAll('.collidable');
          for (let i = 0; i < collidables.length; i++) {
            // Vytvoříme matematický obal kolem překážky a otestujeme dotyk
            this.box.setFromObject(collidables[i].object3D);
            if (this.box.intersectsSphere(this.sphere)) {
              return true;
            }
          }
          return false;
        },

        tick: function (time, timeDelta) {
          if (!timeDelta || !this.leftHand || !this.rightHand) return;
          let dt = timeDelta / 1000;

          let leftPos = this.leftHand.object3D.position;
          let rightPos = this.rightHand.object3D.position;

          if (!this.hasPrev) {
            this.prevLeftLocal.copy(leftPos);
            this.prevRightLocal.copy(rightPos);
            this.hasPrev = true;
            return;
          }

          // Spočítáme, jak moc jsi fyzicky pohnul rukou v reálu
          let leftDelta = new THREE.Vector3().subVectors(leftPos, this.prevLeftLocal).applyQuaternion(this.el.object3D.quaternion);
          let rightDelta = new THREE.Vector3().subVectors(rightPos, this.prevRightLocal).applyQuaternion(this.el.object3D.quaternion);

          // Dotýkají se ruce něčeho pevného?
          let leftColliding = this.checkCollision(this.leftHand);
          let rightColliding = this.checkCollision(this.rightHand);

          let isGripping = false;
          let activeDelta = new THREE.Vector3();

          // Detekce, která ruka se zrovna drží stěny/země
          if (leftColliding && rightColliding) {
            activeDelta.copy(leftDelta).add(rightDelta).multiplyScalar(0.5);
            isGripping = true;
          } else if (leftColliding) {
            activeDelta.copy(leftDelta);
            isGripping = true;
          } else if (rightColliding) {
            activeDelta.copy(rightDelta);
            isGripping = true;
          }

          if (isGripping) {
            // HRÁČ LEZE / ODRÁŽÍ SE: Posuneme avatara přesně opačným směrem, než švihla ruka
            this.el.object3D.position.sub(activeDelta);
            
            // Nastavíme výstupní rychlost pro skok (násobič 1.25)
            this.velocity.copy(activeDelta).multiplyScalar(-1.25 / dt);
          } else {
            // HRÁČ PADÁ NEBO LETÍ VE VZDUCHU
            this.velocity.y += this.gravity * dt; // Aplikace gravitace
            
            this.el.object3D.position.x += this.velocity.x * dt;
            this.el.object3D.position.y += this.velocity.y * dt;
            this.el.object3D.position.z += this.velocity.z * dt;

            // Tření vzduchu (mírné zpomalování)
            this.velocity.x *= 0.98;
            this.velocity.z *= 0.98;
          }

          // Hráč narazí na základní zem - zastavení propadání
          if (this.el.object3D.position.y <= 0) {
            this.el.object3D.position.y = 0;
            if (this.velocity.y < 0) this.velocity.y = 0;
          }

          this.prevLeftLocal.copy(leftPos);
          this.prevRightLocal.copy(rightPos);
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #4cc9f0">
      <a-light type="ambient" intensity="0.7"></a-light>
      <a-light type="directional" position="-1 3 2" intensity="0.8"></a-light>

      <!-- PODLAHA - Třída "collidable" dovoluje se od ní odrazit -->
      <a-box class="collidable" position="0 -0.05 0" width="100" height="0.1" depth="100" color="#38b000"></a-box>

      <!-- 
        PARKOUR PŘEKÁŽKY 
        Stačí přidat class="collidable" a ihned se po nich dá šplhat!
      -->
      <!-- Nízká bedna -->
      <a-box class="collidable" position="0 0.5 -3" width="3" height="1" depth="3" color="#f72585"></a-box>
      
      <!-- Obří stěna na šplhání -->
      <a-box class="collidable" position="3 2 -5" width="4" height="4" depth="1" color="#7209b7"></a-box>
      
      <!-- Levitující plošina vysoko nahoře -->
      <a-box class="collidable" position="-3 3 -6" width="3" height="0.5" depth="3" color="#3a0ca3"></a-box>
      <!-- Sloup pod plošinou, po kterém se dá ručkovat nahoru -->
      <a-cylinder class="collidable" position="-3 1.5 -6" radius="0.5" height="3" color="#4361ee"></a-cylinder>

      <!-- HRÁČ S GTAG FYZIKOU -->
      <a-entity id="rig" gorilla-locomotion position="0 0 0">
        <!-- Kamera - NULOVÝ POSUN, vše řídí WebXR senzor tvojí výšky -->
        <a-entity id="head" camera position="0 0 0" look-controls></a-entity>

        <a-entity id="leftHand" oculus-touch-controls="hand: left">
          <a-sphere radius="0.12" color="#ff4d6d" opacity="0.8"></a-sphere>
        </a-entity>

        <a-entity id="rightHand" oculus-touch-controls="hand: right">
          <a-sphere radius="0.12" color="#00b4d8" opacity="0.8"></a-sphere>
        </a-entity>
      </a-entity>
      
    </a-scene>
  </body>
</html>
