<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GTag VR - Realistická Gravitace</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script>
      AFRAME.registerComponent('gtag-physics', {
        init: function () {
          this.rig = document.getElementById('rig');
          this.velocity = new THREE.Vector3(0, 0, 0); // Rychlost pohybu hráče
          this.gravity = -9.81; // Gravitační zrychlení
          this.prevPos = new THREE.Vector3();
          this.currPos = new THREE.Vector3();
          this.hasPrev = false;
        },
        tick: function (time, timeDelta) {
          if (!this.rig || !timeDelta) return;

          // Převod času z milisekund na sekundy
          let dt = timeDelta / 1000;

          // 1. ZJISTÍME POHYB RUKY (OVLADAČE)
          this.el.object3D.getWorldPosition(this.currPos);

          if (this.hasPrev) {
            let dx = this.currPos.x - this.prevPos.x;
            let dy = this.currPos.y - this.prevPos.y;
            let dz = this.currPos.z - this.prevPos.z;

            // Pokud ruka plácne k zemi (výška < 0.6m) nebo švihne dolů
            if (this.currPos.y < 0.6 && dy < 0) {
              // Udělíme hráčovi okamžitý impuls OPAČNÝM směrem než švihla ruka
              let bounceForce = 3.5;
              this.velocity.x = -dx * bounceForce * 15;
              this.velocity.y = -dy * bounceForce * 12; // Vymrštění do vzduchu
              this.velocity.z = -dz * bounceForce * 15;
            }
          }
          this.prevPos.copy(this.currPos);
          this.hasPrev = true;

          // 2. APLIKACE GRAVITACE
          // Pokud je hráč ve vzduchu, gravitace ho táhne dolů
          if (this.rig.object3D.position.y > 0 || this.velocity.y > 0) {
            this.velocity.y += this.gravity * dt; // Zrychlování pádu
          }

          // 3. POSUN HRÁČE PODLE RYCHLOSTI
          this.rig.object3D.position.x += this.velocity.x * dt;
          this.rig.object3D.position.y += this.velocity.y * dt;
          this.rig.object3D.position.z += this.velocity.z * dt;

          // Postupné zpomalování horizontálního dojezdu (tření vzduchu)
          this.velocity.x *= 0.95;
          this.velocity.z *= 0.95;

          // 4. KOLIZE SE ZEMÍ (DOPAD)
          if (this.rig.object3D.position.y <= 0) {
            this.rig.object3D.position.y = 0;
            this.velocity.y = 0; // Zastavení pádu na zemi
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #70d6ff">
      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="-1 4 2" intensity="0.6"></a-light>

      <!-- Podlaha -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#38b000"></a-plane>

      <!-- Parkour bedny na skákání -->
      <a-box position="0 0.5 -3" width="2" height="1" depth="2" color="#7f4f24"></a-box>
      <a-box position="-3 1.2 -5" width="2" height="2.4" depth="2" color="#582f0e"></a-box>
      <a-box position="3 2 -7" width="3" height="4" depth="3" color="#7f4f24"></a-box>

      <!-- HRÁČ -->
      <a-entity id="rig" position="0 0 0">
        <!-- Kamera nízko u země -->
        <a-entity camera position="0 0.4 0" look-controls></a-entity>

        <!-- Levý ovladač -->
        <a-entity oculus-touch-controls="hand: left" gtag-physics>
          <a-sphere radius="0.12" color="#e63946"></a-sphere>
        </a-entity>

        <!-- Pravý ovladač -->
        <a-entity oculus-touch-controls="hand: right" gtag-physics>
          <a-sphere radius="0.12" color="#1d3557"></a-sphere>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
